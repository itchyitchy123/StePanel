{{- define "stepanel.labels" -}}
app.kubernetes.io/name: stepanel
app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
{{- if ne (int .Values.replicaCount) 1 }}
{{- fail "replicaCount must be 1 because jobs and persistent state are process-local" }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-stepanel
  labels:
    {{- include "stepanel.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "stepanel.labels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-stepanel
  labels:
    {{- include "stepanel.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "stepanel.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stepanel.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: stepanel
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: http, containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          env:
            - {name: STEPANEL_ENV, value: "production"}
            - {name: STEPANEL_LISTEN, value: ":8080"}
            - name: STEPANEL_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.existingSecret }}, key: admin-password}}
            - name: STEPANEL_SESSION_SECRET
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.existingSecret }}, key: session-secret}}
          readinessProbe: {httpGet: {path: /api/health, port: http}, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /api/health, port: http}, initialDelaySeconds: 15, periodSeconds: 20, timeoutSeconds: 2, failureThreshold: 3}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: stepanel-data, mountPath: /var/lib/ste-panel}
            - {name: stepanel-sites, mountPath: /var/www/sites}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: stepanel-data
          {{ if .Values.persistence.enabled }}
          persistentVolumeClaim: {claimName: {{ .Release.Name }}-stepanel-data}
          {{ else }}
          emptyDir: {}
          {{ end }}
        - name: stepanel-sites
          {{ if .Values.persistence.enabled }}
          persistentVolumeClaim: {claimName: {{ .Release.Name }}-stepanel-sites}
          {{ else }}
          emptyDir: {}
          {{ end }}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
{{- if .Values.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-stepanel-data
spec:
  accessModes:
{{- toYaml .Values.persistence.accessModes | nindent 4 }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  resources: {requests: {storage: {{ .Values.persistence.size }}}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-stepanel-sites
spec:
  accessModes:
{{- toYaml .Values.persistence.accessModes | nindent 4 }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  resources: {requests: {storage: {{ .Values.persistence.size }}}}
{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-stepanel
  labels:
    {{- include "stepanel.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-stepanel
                port:
                  number: {{ .Values.service.port }}
{{- end }}
