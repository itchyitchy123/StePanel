apiVersion: v1
kind: Namespace
metadata:
  name: stepanel
---
apiVersion: v1
kind: Service
metadata:
  name: stepanel
  namespace: stepanel
  labels:
    app.kubernetes.io/name: stepanel
spec:
  selector:
    app.kubernetes.io/name: stepanel
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stepanel-data
  namespace: stepanel
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 10Gi}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stepanel-sites
  namespace: stepanel
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 10Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stepanel
  namespace: stepanel
  labels:
    app.kubernetes.io/name: stepanel
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: stepanel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stepanel
    spec:
      automountServiceAccountToken: false
      # Match the application's two-hour restore drain plus a five-minute margin.
      terminationGracePeriodSeconds: 7500
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stepanel
          image: ghcr.io/itchyitchy123/stepanel:v0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          env:
            - name: STEPANEL_ENV
              value: "production"
            - name: STEPANEL_LISTEN
              value: ":8080"
            - name: STEPANEL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stepanel-secrets
                  key: admin-password
            - name: STEPANEL_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: stepanel-secrets
                  key: session-secret
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - {name: stepanel-data, mountPath: /var/lib/ste-panel}
            - {name: stepanel-sites, mountPath: /var/www/sites}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: stepanel-data
          persistentVolumeClaim: {claimName: stepanel-data}
        - name: stepanel-sites
          persistentVolumeClaim: {claimName: stepanel-sites}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
