apiVersion: v1
kind: Namespace
metadata:
  name: stepanel
---
apiVersion: v1
kind: Service
metadata:
  name: stepanel
  namespace: stepanel
  labels:
    app.kubernetes.io/name: stepanel
spec:
  selector:
    app.kubernetes.io/name: stepanel
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stepanel
  namespace: stepanel
  labels:
    app.kubernetes.io/name: stepanel
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: stepanel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stepanel
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stepanel
          image: ghcr.io/itchyitchy123/stepanel:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: STEPANEL_PRODUCTION
              value: "true"
            - name: STEPANEL_LISTEN
              value: ":8080"
            - name: STEPANEL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stepanel-secrets
                  key: admin-password
            - name: STEPANEL_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: stepanel-secrets
                  key: session-secret
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
