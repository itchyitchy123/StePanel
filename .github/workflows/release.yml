name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
      - name: Build release artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 \
              go build -trimpath -ldflags="-s -w -X main.Commit=${GITHUB_SHA} -X main.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              -o "dist/stepanel-${VERSION}-${target%/*}-${target#*/}" .
          done
          sha256sum dist/* > dist/SHA256SUMS
      - name: Generate SBOM
        uses: anchore/sbom-action@v0.17.0
        with:
          path: .
          format: spdx-json
          output-file: dist/SBOM.spdx.json
      - name: Attest release provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'dist/*'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture container
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/itchyitchy123/stepanel:${{ github.ref_name }}
            ghcr.io/itchyitchy123/stepanel:latest
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
