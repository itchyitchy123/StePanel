name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.7'
      - name: Verify tag matches source version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          source_version=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' version.go)
          tag_version=${RELEASE_TAG#v}
          test -n "$source_version" || { echo 'version.go does not declare Version' >&2; exit 1; }
          test "$source_version" = "$tag_version" || {
            echo "release tag $RELEASE_TAG does not match version.go ($source_version)" >&2
            exit 1
          }
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/main" || {
            echo "release tag must point to a commit already reachable from main" >&2
            exit 1
          }
      - name: Build release artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 \
              go build -trimpath -ldflags="-s -w -X main.Commit=${GITHUB_SHA} -X main.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              -o "dist/stepanel-${VERSION}-${target%/*}-${target#*/}" .
          done
          sha256sum dist/* > dist/SHA256SUMS
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: dist/SBOM.spdx.json
      - name: Attest release provenance
        uses: actions/attest-build-provenance@92c65d2898f1f53cfdc910b962cecff86e7f8fcc # v1
        with:
          subject-path: 'dist/*'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture container
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/itchyitchy123/stepanel:${{ github.ref_name }}
      - uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          files: dist/*
