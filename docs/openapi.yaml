openapi: 3.0.3
info:
  title: StePanel API
  version: 0.6.0
  description: |
    Authenticated server operations, service inventory, and migration API.
    Mutating requests require the `stepanel_session` cookie and the matching
    `stepanel_csrf` value in the `X-CSRF-Token` header or `csrf` form field.
    Responses include an `X-Request-ID` correlation identifier.
servers:
  - url: http://127.0.0.1:8090
security:
  - sessionCookie: []
paths:
  /api/database:
    get:
      summary: Database engine and administration UI status
      responses:
        '200':
          description: Selected database engine, service health, client availability, and matching admin UI readiness
  /api/database/diagnostics:
    get:
      summary: Bounded database health counters
      responses:
        '200': {description: Connections, long transactions, blocking, deadlocks, and allocated database bytes}
        '503': {description: Restricted local database diagnostics are unavailable}
  /api/database/settings:
    get:
      summary: Read-only effective database settings allowlist
      responses:
        '200': {description: Engine-specific capacity, logging, memory, and recovery settings}
  /api/database/sessions:
    get:
      summary: Active database session metadata without SQL text
      responses:
        '200': {description: Up to 200 sessions with age, state, and wait class}
  /api/database/sessions/{id}:
    delete:
      summary: Terminate one database session after exact confirmation
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, minimum: 1}}
      responses:
        '204': {description: Session terminated and action audited}
        '422': {description: Confirmation must exactly match TERMINATE plus the session ID}
  /api/databases:
    get:
      summary: List site-owned databases managed by StePanel
      responses:
        '200': {description: Database, owner, user, encoding, and allocated bytes}
    post:
      summary: Create a database and least-privilege site user
      responses:
        '201': {description: Database and user created; password is never returned or stored by StePanel}
        '409': {description: Object already exists or provisioning failed safely}
  /api/databases/{name}:
    get:
      summary: Inspect one managed database without exposing credentials
      parameters:
        - {name: name, in: path, required: true, schema: {type: string, pattern: '^[a-z0-9_]{1,63}$'}}
      responses:
        '200': {description: Database owner, user, encoding, and allocated bytes}
        '404': {description: Managed database not found}
    delete:
      summary: Create a safety dump, then delete a managed database and user
      parameters:
        - {name: name, in: path, required: true, schema: {type: string, pattern: '^[a-z0-9_]{1,63}$'}}
      responses:
        '200': {description: Database deleted with safety-backup path and checksum}
        '503': {description: Deletion refused because the safety backup failed}
  /api/databases/{name}/credentials:
    patch:
      summary: Rotate a managed database user's password
      responses:
        '204': {description: Credential rotated; caller must update the application secret}
  /livez:
    get:
      security: []
      summary: Process liveness only
      responses:
        '204': {description: Process event loop is responding}
  /readyz:
    get:
      security: []
      summary: Persistent state and storage capacity readiness
      responses:
        '200': {description: Control plane can safely accept work}
        '503': {description: Job persistence or a managed filesystem is unavailable or below its free-space floor}
  /api/health:
    get:
      security: []
      summary: Process health
      responses:
        '200': {description: Healthy process}
  /api/services:
    get:
      summary: Service inventory
      responses:
        '200': {description: Service inventory}
  /api/node/versions:
    get:
      summary: List installed NVM Node versions
      responses:
        '200': {description: Installed versions}
  /api/node/select:
    post:
      summary: Select the Node version for a managed site
      responses:
        '200': {description: Version selected}
  /api/proxy:
    get:
      summary: List managed reverse proxies
      responses:
        '200': {description: Managed reverse proxies}
  /api/proxy/deploy:
    post:
      summary: Deploy and reload a validated reverse proxy
      responses:
        '202': {description: Proxy deployed}
  /api/proxy/test:
    post:
      summary: Test a local or private backend
      responses:
        '200': {description: Backend reachability result}
  /api/proxy/{name}:
    delete:
      summary: Remove a managed reverse proxy
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Proxy removed}
  /api/caddy/htaccess:
    post:
      summary: Preview or apply a constrained Apache .htaccess conversion
      description: Applying requires Caddy and refuses unsupported directives unless allow_partial is explicitly enabled.
      responses:
        '200': {description: Conversion preview}
        '202': {description: Converted rules validated and applied}
        '422': {description: Unsupported or invalid directives require operator review}
  /api/apps:
    get:
      summary: List managed Node applications
      responses:
        '200': {description: Managed applications}
  /api/apps/deploy:
    post:
      summary: Deploy a managed Node application
      responses:
        '202': {description: Application deployed}
  /api/apps/{site}/{action}:
    post:
      summary: Start, stop, restart, or roll back an application
      parameters:
        - {name: site, in: path, required: true, schema: {type: string}}
        - {name: action, in: path, required: true, schema: {type: string, enum: [start, stop, restart, rollback]}}
      responses:
        '202': {description: Action accepted}
  /api/ftp:
    get:
      summary: FTP service setup status
      responses:
        '200': {description: vsftpd status and safe setup defaults}
  /api/security/audit:
    get:
      summary: Security posture checks
      responses:
        '200': {description: Security checks}
  /api/audit/events:
    get:
      summary: Query verified audit and deployment history
      parameters:
        - {name: target, in: query, schema: {type: string}, description: Exact case-insensitive target filter}
        - {name: action, in: query, schema: {type: string}, description: Exact case-insensitive action filter}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        '200': {description: Bounded events with verified, empty, or unconfigured integrity state}
        '503': {description: Audit-chain integrity verification failed}
  /api/doctor:
    get:
      summary: Run read-only operator diagnostics
      responses:
        '200': {description: Webserver, database, PHP-FPM, helper, and disk checks}
  /api/cloud:
    get:
      summary: Read cloud server, DNS, load balancer, and snapshot inventory
      responses:
        '200': {description: Cloud inventory}
  /api/cloud/action:
    post:
      summary: Start, stop, reboot, or snapshot an existing cloud resource
      responses:
        '202': {description: Provider action queued; poll the returned job URL}
  /api/cloud/dns:
    get:
      summary: List Linode DNS records
      responses:
        '200': {description: DNS records}
    post:
      summary: Queue a Linode DNS record creation or update
      responses:
        '202': {description: DNS change queued}
    delete:
      summary: Queue a Linode DNS record deletion
      responses:
        '202': {description: DNS change queued}
  /api/dns/capabilities:
    get:
      summary: Report the provider-neutral DNS adapter contract
      responses:
        '200': {description: Configured adapter, supported adapters, and DNSSEC status}
  /api/cloud/loadbalancer:
    post:
      summary: Queue a Linode load-balancer backend add or removal
      responses:
        '202': {description: Load-balancer change queued}
  /api/cloud/snapshots:
    get:
      summary: List Linode snapshots
      responses:
        '200': {description: Snapshots}
    delete:
      summary: Queue deletion of a Linode snapshot
      responses:
        '202': {description: Snapshot deletion queued}
  /api/ssh:
    get:
      summary: Inspect configured SSH servers with strict host-key checking
      responses:
        '200': {description: Reachability, OS, failed units, and root filesystem status}
  /api/ssh/action:
    post:
      summary: Queue an allowlisted SSH service restart or reboot
      responses:
        '202': {description: SSH action queued; poll the returned job URL}
  /api/capabilities:
    get:
      summary: Report features available in the current deployment
      responses:
        '200': {description: Capability flags derived from installed helpers and dependencies}
  /api/accounts:
    get:
      summary: List shared-hosting customer accounts and plan limits (administrator only)
      responses:
        '200': {description: Customer account metadata without password hashes or TOTP secrets}
        '403': {description: Administrator access required}
    post:
      summary: Create a shared-hosting customer account with explicit site assignments (administrator only)
      responses:
        '201': {description: Customer account created without password or TOTP secret disclosure}
        '422': {description: Invalid plan, assigned sites, password, or TOTP seed}
  /api/accounts/{username}:
    patch:
      summary: Suspend or unsuspend a shared-hosting customer account (administrator only)
      parameters:
        - {name: username, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [suspended]
              properties:
                suspended: {type: boolean}
      responses:
        '200': {description: Updated account}
    delete:
      summary: Remove a shared-hosting customer login (administrator only; workloads retained)
      parameters:
        - {name: username, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: Customer login removed; hosting workloads are retained}
  /api/accounts/{username}/mfa:
    post:
      summary: Regenerate a customer's TOTP secret and revoke sessions (administrator only)
      parameters:
        - {name: username, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Replacement TOTP secret returned once}
  /api/accounts/{username}/recovery-codes:
    post:
      summary: Generate one-time customer MFA recovery codes and revoke sessions (administrator only)
      parameters:
        - {name: username, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Recovery codes returned once; only bcrypt hashes are persisted}
  /api/accounts/{username}/recover:
    post:
      summary: Reset customer credentials and revoke sessions (administrator only)
      parameters:
        - {name: username, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Temporary password, new TOTP seed, and recovery codes returned once}
  /api/account/password:
    post:
      summary: Complete the authenticated customer's required password change
      responses:
        '204': {description: Password changed and session revoked}
  /api/account/mfa:
    post:
      summary: Complete the authenticated customer's required MFA enrollment
      responses:
        '204': {description: TOTP enrollment saved and session revoked}
  /api/security/scan:
    post:
      summary: Scan a managed site for suspicious PHP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [site]
              properties:
                site: {type: string}
                quarantine: {type: boolean}
      responses:
        '200': {description: Scan results}
  /api/certificates/issue:
    post:
      summary: Queue a Let’s Encrypt certificate request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain, email]
              properties:
                domain: {type: string, format: hostname}
                email: {type: string, format: email}
      responses:
        '202': {description: Certificate job queued}
  /api/sites:
    get:
      summary: List managed PHP site routes
      responses:
        '200': {description: Managed site vhost names}
  /api/sites/overview:
    get:
      summary: List site-centric developer workspaces
      responses:
        '200': {description: Sites with document roots, routes, applications, and managed database counts}
  /api/sites/overview/{site}:
    get:
      summary: Inspect one site-centric developer workspace
      parameters:
        - {name: site, in: path, required: true, schema: {type: string, pattern: '^[a-z0-9_-]{1,32}$'}}
      responses:
        '200': {description: Site workspace details}
        '404': {description: Site not found}
  /api/sites/deploy:
    post:
      summary: Deploy a PHP site through its isolated PHP-FPM pool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [site, domain]
              properties:
                site: {type: string, pattern: '^[a-z0-9_-]{1,32}$'}
                domain: {type: string, format: hostname}
      responses:
        '202': {description: Vhost validated, activated, and Apache reloaded}
        '422': {description: Invalid route or missing site document root}
        '503': {description: Host validation or Apache reload failed}
  /api/sites/environment/{site}:
    get:
      summary: Read site environment metadata with secrets masked
      parameters:
        - {name: site, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Environment metadata}
    put:
      summary: Replace site environment variables
      parameters:
        - {name: site, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: {type: object}}}}
      responses: {'204': {description: Environment saved}}
    delete:
      summary: Delete all site environment variables
      parameters:
        - {name: site, in: path, required: true, schema: {type: string}}
      responses: {'204': {description: Environment deleted}}
  /api/sites/php/{site}:
    get:
      summary: Inspect a site PHP runtime profile and installed versions
      parameters: [{name: site, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Runtime profile and capability inventory}}
    put:
      summary: Apply a validated per-site PHP-FPM runtime profile
      parameters: [{name: site, in: path, required: true, schema: {type: string}}]
      responses: {'202': {description: FPM profile validated and applied}}
  /api/sites/resources/{site}:
    get:
      summary: Inspect a per-site resource profile and its enforcement scope
      parameters: [{name: site, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Desired/applied resource profile}}
    put:
      summary: Apply CPU, memory, I/O, task and PHP-FPM worker ceilings for a site
      parameters: [{name: site, in: path, required: true, schema: {type: string}}]
      responses: {'202': {description: Systemd slice and FPM profile applied}}
  /api/reconcile/resources:
    post:
      summary: Reconcile pending/inactive desired resource profiles with systemd and PHP-FPM
      responses: {'200': {description: Reconciled and failed site lists}}
  /api/reconcile/tasks:
    post:
      summary: Reconcile pending or deleted scheduled-task desired state with systemd
      responses: {'200': {description: Reconciled and failed task lists}}
  /api/sites/usage/{site}:
    get:
      summary: Measure bounded regular-file usage for a site without following symlinks
      parameters: [{name: site, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Bytes, file count, directory count and completeness}}
  /api/security/center:
    get:
      summary: Read administrator host security and operational posture
      responses: {'200': {description: Existing security checks, webserver-specific WAF capability, service states, disk/inode and backup posture}}
  /api/backups/restore-to-staging:
    post:
      summary: Restore verified backup files into a new isolated staging site
      description: Refuses existing destinations and deliberately does not restore database dumps.
      responses: {'202': {description: Files restored and staging route activated}}
  /api/backups/verify:
    post:
      summary: Verify a backup archive and optional authenticated manifest
      description: Performs archive, entry, checksum, and manifest-signature checks without extracting or changing host state.
      responses: {'200': {description: Verified backup and consistency classification}}
  /api/backups/restore-files:
    post:
      summary: Queue an administrator-only verified files-only site restore
      description: Verifies the archive and optional manifest signature, then atomically replaces site files through the recovery journal. Databases are preserved.
      responses: {'202': {description: Restore job queued}}
  /api/backups/restore-database:
    post:
      summary: Queue an administrator-only verified database restore
      description: Creates a verified safety backup, then imports the selected dump into an existing managed database registered to the site. Schema rollback remains manual.
      responses: {'202': {description: Database restore job queued}}
  /api/backups/restore-offsite-files:
    post:
      summary: Queue an administrator-only verified off-site files restore
      description: Retrieves only the fixed backup objects for the configured rclone site/backup layout, verifies them, and atomically restores files while preserving databases.
      responses: {'202': {description: Off-site restore job queued}}
  /api/backups/restore-offsite-database:
    post:
      summary: Queue an administrator-only verified off-site database restore
      description: Retrieves fixed remote backup objects, creates a local safety backup, and imports the selected dump into an existing managed database. Schema rollback remains manual.
      responses: {'202': {description: Off-site database restore job queued}}
  /api/composer/{site}:
    get:
      summary: Inspect Composer project files and last operation
      parameters: [{name: site, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Composer status}}
  /api/composer/{site}/install:
    post:
      summary: Install Composer dependencies as the isolated site identity
      parameters: [{name: site, in: path, required: true, schema: {type: string}}]
      responses: {'202': {description: Install completed}}
  /api/runner/build:
    post:
      summary: Execute a validated build definition in the rootless Podman runner
      responses: {'202': {description: Build completed with artifact output}}
  /api/deployments:
    get:
      summary: List durable sandbox-build and atomic-release activation records
      parameters: [{name: site, in: query, required: false, schema: {type: string}}]
      responses: {'200': {description: Site-scoped deployment records}}
  /api/deployments/run:
    post:
      summary: Run a preview sandbox-build-to-atomic-activation release pipeline
      description: Checks out source outside the live document root, optionally creates a verified backup, requires the runner to write a complete /artifact tree, validates it, and atomically activates it. Database migrations and post-activation health checks are intentionally not yet automated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [site, repository, image, commands]
              properties:
                site: {type: string}
                repository: {type: string}
                ref: {type: string, default: main}
                image: {type: string}
                commands: {type: array, items: {type: string}, maxItems: 16}
                backup_before_activate: {type: boolean, default: false}
      responses: {'202': {description: Built release atomically activated}}
  /api/staging:
    post:
      summary: Create a recovery-journaled staging site from safe file copies
      description: Staging routes use no-index by default. Set basic_auth with auth_user and auth_password to enable helper-managed Basic Auth; the plaintext password is never persisted.
      responses: {'202': {description: Staging site created}}
  /api/tasks/{site}:
    get:
      summary: List bounded systemd-timer scheduled tasks for a site
      parameters: [{name: site, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Scheduled task definitions}}
  /api/tasks/{site}/{name}:
    put:
      summary: Create or replace a site-identity scheduled task
      parameters: [{name: site, in: path, required: true, schema: {type: string}}, {name: name, in: path, required: true, schema: {type: string}}]
      responses: {'202': {description: Systemd service and timer applied}}
    delete:
      summary: Remove a scheduled task service and timer
      parameters: [{name: site, in: path, required: true, schema: {type: string}}, {name: name, in: path, required: true, schema: {type: string}}]
      responses: {'204': {description: Scheduled task removed}}
  /api/sites/logs/{site}:
    get:
      summary: Read bounded, filtered site logs from allowlisted sources
      parameters: [{name: site, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Log lines or downloadable text}}
  /api/workers/{site}:
    get:
      summary: List managed background workers for a site
      parameters: [{name: site, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Worker definitions}}
  /api/sites/git-deploy:
    post:
      summary: Checkout and atomically activate a Git release
      description: The repository hostname must be present in STEPANEL_GIT_ALLOWED_HOSTS. Public HTTPS URLs and private git@host:path.git URLs authenticated by a per-site deploy key are accepted. Symlinks and non-regular files are rejected, Git metadata is removed, and repository build scripts are not executed. Use a separately sandboxed build runner for source builds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [site, repository]
              properties:
                site: {type: string, pattern: '^[a-z0-9_-]{1,32}$'}
                repository: {type: string, description: 'https://host/path.git or git@host:path.git'}
                ref: {type: string, default: main}
      responses:
        '202': {description: Release activated and previous site release preserved}
        '422': {description: Invalid site, repository, or ref}
        '502': {description: Git checkout or commit identification failed}
  /api/sites/git-key/{site}:
    get:
      summary: Inspect whether a site deploy key is configured and return its public key
      parameters: [{name: site, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Deploy-key metadata; no private key material is ever returned}}
    post:
      summary: Generate a root-owned ED25519 deploy key and return only its public half
      parameters: [{name: site, in: path, required: true, schema: {type: string}}]
      responses: {'201': {description: Public deploy key generated}}
    delete:
      summary: Retire a site deploy key
      parameters: [{name: site, in: path, required: true, schema: {type: string}}]
      responses: {'204': {description: Deploy key retired}}
  /api/sites/git-webhook:
    post:
      summary: Deploy a signed Git webhook payload
      parameters:
        - {name: X-StePanel-Signature, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [site, repository]
              properties:
                site: {type: string}
                repository: {type: string, format: uri}
                ref: {type: string}
      responses:
        '202': {description: Deployment accepted}
        '401': {description: Invalid signature}
  /api/sites/git-rollback:
    post:
      summary: Atomically restore the latest preserved Git site release
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [site, confirm]
              properties:
                site: {type: string, pattern: '^[a-z0-9_-]{1,32}$'}
                confirm: {type: string, description: 'Must equal ROLLBACK followed by the site name'}
      responses:
        '200': {description: Previous release activated and replaced release preserved}
        '409': {description: No valid previous release is available}
  /api/sites/{name}:
    delete:
      summary: Remove a managed PHP site route
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Vhost removed and Apache reloaded}
        '404': {description: Managed route not found}
  /api/backups:
    get:
      summary: List published site backup summaries
      responses:
        '200': {description: Backup paths, checksums, sizes, databases, and verification times}
    post:
      summary: Queue a verified site backup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [site]
              properties:
                site: {type: string, pattern: '^[a-z0-9_-]{1,32}$'}
                include_databases: {type: boolean, default: false}
      responses:
        '202': {description: Backup job queued}
  /api/backup-schedules:
    get:
      summary: List scheduled site backups
      responses:
        '200': {description: Schedules with retention, last success, error, duration, and consecutive failures}
    put:
      summary: Create or replace a site backup schedule
      responses:
        '200': {description: Schedule saved}
    delete:
      summary: Delete a site backup schedule
      responses:
        '204': {description: Schedule deleted}
        '422': {description: Invalid site or unavailable managed-database helper}
        '429': {description: Site already has an active restore or backup job}
  /api/cpmove/inspect:
    post:
      summary: Inspect a cPanel backup archive
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [backup]
              properties:
                backup: {type: string, format: binary}
      responses:
        '200': {description: Archive inventory}
  /api/cpmove/import:
    post:
      summary: Queue a cPanel restore
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [backup, username, confirm]
              properties:
                backup: {type: string, format: binary}
                username: {type: string}
                confirm: {type: string, example: IMPORT}
                restore_databases: {type: string}
      responses:
        '202': {description: Restore job queued}
  /api/wpress/preflight:
    get:
      summary: Check WordPress restore dependencies
      responses:
        '200': {description: wpress-extract, WP-CLI, and database client availability}
  /api/wpress/import:
    post:
      summary: Queue an All-in-One WP Migration restore
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [backup, site, db_name, db_user, db_password, confirm]
              properties:
                backup: {type: string, format: binary}
                site: {type: string}
                db_name: {type: string, pattern: '^[a-z0-9_]{1,40}$'}
                db_user: {type: string, pattern: '^[a-z0-9_]{1,40}$'}
                db_password: {type: string, format: password, minLength: 16, maxLength: 128}
                site_url: {type: string, format: uri}
                table_prefix: {type: string, default: wp_}
                overwrite: {type: string}
                confirm: {type: string, example: WPRESTORE}
      responses:
        '202': {description: WordPress restore job queued}
  /api/jobs/{id}:
    get:
      summary: Read a background job
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Job state}
        '404': {description: Job not found}
  /api/jobs:
    get:
      summary: List recent persistent jobs
      responses:
        '200': {description: Up to 100 jobs, newest first}
  /metrics:
    get:
      summary: Prometheus metrics
      responses:
        '200': {description: Metrics output}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: stepanel_session
